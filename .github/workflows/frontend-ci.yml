name: Frontend CI
# Chay khi push dev/main. Repo deploy-staging nghe xong run nay de deploy Vercel.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # create-react-app tung TypeScript ra trong luong build, nen buoc nay
      # dong vai tro kiem tra kiieu. CI=false de canh bao ESLint khong lam do build.
      - name: Build
        run: npm run build
        env:
          CI: "false"
