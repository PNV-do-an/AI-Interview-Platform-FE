name: Frontend CI
# Push dev/main -> Build. Build xanh tren dev thi bump con tro submodule
# `frontend` trong superrepo deploy-staging; superrepo do deploy Vercel.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # create-react-app tung TypeScript ra trong luong build, nen buoc nay
      # dong vai tro kiem tra kiieu. CI=false de canh bao ESLint khong lam do build.
      - name: Build
        run: npm run build
        env:
          CI: "false"

  # Build xanh tren dev thi cong con tro submodule `frontend` trong superrepo
  # deploy-staging; superrepo moi deploy Vercel. PAT can quyen Contents: r/w.
  bump-superrepo:
    name: Bump superrepo submodule
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push new submodule pointer
        env:
          PAT: ${{ secrets.DEPLOY_PAT }}
          SHA: ${{ github.sha }}
          SUB: frontend
        run: |
          set -euo pipefail
          if [ -z "$PAT" ]; then echo "Thieu secret DEPLOY_PAT"; exit 1; fi
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PAT" | base64 -w0)"
          url=https://github.com/PNV-do-an/AI-Interview-Platform-deploy-staging.git
          for try in 1 2 3; do
            rm -rf /tmp/super
            git clone --quiet "$url" /tmp/super
            git -C /tmp/super update-index --add --replace --cacheinfo 160000,"$SHA","$SUB"
            if git -C /tmp/super diff --cached --quiet; then
              echo "superrepo dang tro dung $SHA, khong bump"; exit 0
            fi
            git -C /tmp/super commit -q -m "chore(deploy): $SUB -> $SHA"
            if git -C /tmp/super push --quiet origin HEAD:dev; then
              echo "da bump $SUB -> $SHA"; exit 0
            fi
            echo "push bi conflict, thu lan $try"; sleep 5
          done
          echo "khong bump duoc sau 3 lan"; exit 1
