# Chạy full stack local: MySQL + backend (Spring Boot) + frontend (nginx serve bản build)
#
#   docker compose up -d --build
#
# FE  -> http://localhost:3000       (nginx proxy /api/ sang backend)
# BE  -> http://localhost:8081
# DB  -> localhost:3307 (ai_interview_db / root / admin123, dữ liệu giữ trong volume mysql-data)
#
# Không hot reload — sửa code FE phải `docker compose up -d --build frontend`.
# Cổng host chọn 3307/8081 để không giành 3306 (MySQL Laragon) và 8080 (container ai-be-verify cũ).
# Build backend cần repo AI-Interview-Platform-BE nằm cạnh repo này (../AI-Interview-Platform-BE).
name: aiinterview-stack

services:
  mysql:
    image: mysql:8.0
    container_name: aiinterview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: ai_interview_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../AI-Interview-Platform-BE
      dockerfile: Dockerfile
    container_name: aiinterview-backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ai_interview_db
      DB_USERNAME: root
      DB_PASSWORD: admin123
      MAIL_TEST_CONNECTION: "false"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiinterview-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
