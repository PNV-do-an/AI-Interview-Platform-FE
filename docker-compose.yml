# Chạy full stack local: MySQL + backend (Spring Boot) + frontend (nginx serve bản build)
#
#   docker compose up -d --build
#
# FE  -> http://localhost:3000       (nginx proxy /api/ sang backend)
# BE  -> http://localhost:8081
# DB  -> localhost:3307 (ai_interview_db / root / admin123, dữ liệu giữ trong volume mysql-data)
#
# Không hot reload — sửa code FE phải `docker compose up -d --build frontend`.
# Cổng host chọn 3307/8081 để không giành 3306 (MySQL Laragon) và 8080 (container ai-be-verify cũ).
# Build backend cần repo AI-Interview-Platform-BE nằm cạnh repo này (../AI-Interview-Platform-BE).
name: aiinterview-stack

services:
  mysql:
    image: mysql:8.0
    container_name: aiinterview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: ai_interview_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../AI-Interview-Platform-BE
      # `Dockerfile` của repo BE đã được đổi sang bản Python AI service (commit d20a7f3), nên build
      # theo tên file mặc định cho ra uvicorn chứ không phải Spring Boot. Khai báo inline để stack
      # local không phụ thuộc cách repo BE dùng file đó.
      dockerfile_inline: |
        FROM maven:3.9.6-eclipse-temurin-17 AS build
        WORKDIR /app
        COPY pom.xml .
        RUN mvn dependency:go-offline -B
        COPY src ./src
        RUN mvn clean package -DskipTests

        FROM eclipse-temurin:17-jre-alpine
        WORKDIR /app
        COPY --from=build /app/target/*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
    container_name: aiinterview-backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ai_interview_db
      DB_USERNAME: root
      DB_PASSWORD: admin123
      # Mail xác thực đi qua Gmail API. Thiếu 4 giá trị này thì POST /register trả 502 có chủ đích
      # (không tạo tài khoản mà không gửi được link). Điền value thật vào file .env cùng thư mục
      # (đã gitignored) — lấy 4 credential từ Render env của service staging.
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Link trong mail trỏ về FE local; muốn test mà chưa có credential thì trỏ 2 biến dưới
      # vào một Gmail API giả (xem memory "Do mail khong can Gmail that").
      GMAIL_TOKEN_URI: ${GMAIL_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GMAIL_API_BASE_URL: ${GMAIL_API_BASE_URL:-https://gmail.googleapis.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # VNPay: backend ky URL thanh toan. Sandbox mac dinh; doi sang production khi co credential that.
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8081/api/v1/payment/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8081/api/v1/payment/vnpay/ipn}
      # AI (CV/study): key lay tu file .env (gitignored). Default khớp application.yml của BE.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_EVAL_MODEL: ${AI_EVAL_MODEL:-gpt-4o-mini}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiinterview-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
